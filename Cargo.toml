[package]
name = "tensor_engine"
version = "0.5.0"
edition = "2021"

[dependencies]
ndarray = { version = "=0.16.1", features = ["rayon"] }
matrixmultiply = "=0.3.10"
blas-src = { version = "=0.10.0", optional = true }

cblas-sys = { version = "=0.1.4", optional = true }

pyo3 = { version = "0.28.3", optional = true, features = ["extension-module"] }
rand = "=0.9.2"
log = "=0.4.28"
rayon = { version = "=1.11.0" }
actix-web = { version = "=4.12.1", optional = true }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "1.0"
base64 = { version = "=0.22.1", optional = true }
half = { version = "=2.7.1", optional = true }
safetensors = { version = "=0.7.0", optional = true }
tokenizers = { version = "=0.15.2", optional = true, default-features = false, features = ["onig"] }
zip = "8.6.0"
regex = "1.10"
# Rocket is used by the references module (formerly a separate crate)
rocket = { version = "0.5.0", optional = true, features = ["json"] }
# Image crate for vision features: loading/resizing/processing images
image = { version = "=0.24.9", optional = true }
# Audio crate for reading/writing WAV: used by audio examples and IO
hound = { version = "=3.5.1", optional = true }

rubato = { version = "=0.12.0", optional = true }
num-integer = { version = "=0.1.46", optional = true }
cffi = { version = "0.1.7", optional = true }
wgpu = { version = "=0.19.0", optional = true }
pollster = { version = "=0.3.0", optional = true }

bytemuck = { version = "1.16.1", optional = true, features = ["derive"] }
futures-intrusive = { version = "0.5", optional = true }
futures-channel = { version = "0.3", optional = true }
cudarc = { version = "0.19.7", optional = true, features = ["cuda-version-from-build-system"] }
cuda = { version = "0.4.0-pre.2", optional = true, features = ["cuda_10_0"] }
cublas = { version = "0.2", optional = true }
cudart = { version = "0.1", optional = true }
tokio = { version = "1.36", features = ["full"], optional = true }
futures = { version = "0.3", optional = true }
uuid = { version = "1.7", features = ["v4"], optional = true }
thiserror = "2.0.18"
indicatif = "0.18.3"
num-complex = "0.4.6"
ouroboros = "0.18.5"
toml = "0.8"
clap = { version = "4.4", features = ["derive"] }
colored = "3.1.1"
protobuf = "3.2"

numpy = { version = "0.28.0", optional = true }
actix-cors = { version = "0.7", optional = true }
actix-web-actors = { version = "4.3", optional = true }

byteorder = { version = "1.4", optional = true }

tonic = { version = "0.14.6", optional = true }
prost = { version = "0.14.3", optional = true }
prometheus = { version = "0.14.0", optional = true }
realfft = { version = "3.5.0", optional = true }
ocl = { version = "0.19", optional = true }
chrono = { version = "0.4", optional = true }
unicode-normalization = "0.1"

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
cudarc = { version = "0.19.7", features = ["cuda-version-from-build-system"] }
bytemuck = { version = "1.16.1", features = ["derive"] }
wgpu = { version = "=0.19.0" }
pollster = { version = "=0.3.0" }
futures-intrusive = { version = "0.5" }
futures-channel = { version = "0.3" }

# macOS: Metal
[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.33.0" }

[dev-dependencies]
approx = "=0.5.1"
criterion = "=0.7.0"
env_logger = "=0.10.2"
tempfile = "=3.23.0"

[[bench]]
name = "matmul_bench"
harness = false

[[bench]]
name = "safetensors_bench"
harness = false

[lib]
name = "tensor_engine"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "engine"
path = "src/bin/engine.rs"

[features]
default = ["python_bindings", "with_tokenizers", "safe_tensors", "vision", "audio", "multi_precision", "async_ops", "openblas", "compat", "opencl"]
openblas = ["blas-src", "cblas-sys"]
multi_precision = ["half"]
safe_tensors = ["safetensors"]
with_tokenizers = ["tokenizers"]
quantized = []
# GPU backends are now platform-specific dependencies (see target.'cfg(...)' sections)
# These features are kept for backward compatibility but don't control dependencies anymore
backend_cuda = []
backend_metal = []
backend_wgpu = []
server = ["actix-web", "actix-cors", "actix-web-actors", "image", "base64", "tokio", "futures", "uuid"]
compat = ["half", "rocket"]
hf_compat = ["half", "byteorder"]
native_tokenizer = []
opencl = ["ocl"]
audio = ["hound", "rubato", "num-integer"]
vision = ["image"]
dtype_f16 = ["half"]
dtype_bf16 = ["half"]
dtype_f8 = []
python_bindings = ["pyo3", "numpy"]
py_abi3 = ["pyo3/abi3"]
async_ops = ["tokio", "futures"]
distributed = []
parallel_io = []
opencl_support = ["opencl"]
grpc_server = ["tonic", "prost"]
metrics = ["prometheus", "chrono"]
audio_fft = ["realfft"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("parallel"))',
    'cfg(feature, values("gpu"))',
    'cfg(feature, values("tch-backend"))',
] }

[patch.crates-io]
# Use local path overrides for cffi-impl to avoid ctor linker issues on Windows/MSVC.
# The patched version removes the #[ctor] dependency in favor of std::sync::Once.
cffi-impl = { path = "vendor/cffi-impl-patch" }
# Use local path overrides for cudart to fix bindgen compatibility with CUDA 13.x headers.
# CUDA 13 introduced versioned type aliases (CUdeviceptr_v2, CUdevice_v1) and new types
# (cudaUUID_t, cudaMemLocation) that aren't whitelisted in the original crate.
cudart = { path = "vendor/cudart-patch" }

