[package]
name = "tensor_engine"
version = "0.3.2"
edition = "2021"

[dependencies]
ndarray = "=0.16.1"
matrixmultiply = "=0.3.10"
blas-src = { version = "=0.10.0", optional = true }

cblas-sys = { version = "=0.1.4", optional = true }

pyo3 = { version = "0.22", optional = true, features = ["extension-module"] }
rand = "=0.9.2"
log = "=0.4.28"
rayon = { version = "=1.11.0" }
actix-web = { version = "=4.12.1", optional = true }
serde = { version = "=1.0.228", features = ["derive"], optional = true }
serde_json = "1.0"
base64 = { version = "=0.22.1", optional = true }
half = { version = "=2.7.1", optional = true }
safetensors = { version = "=0.7.0", optional = true }
tokenizers = { version = "=0.15.2", optional = true, default-features = false, features = ["onig"] }
tch = { version = "=0.7.2", optional = true }
zip = "0.6"
regex = "1.10"
# Rocket is used by the references module (formerly a separate crate)
rocket = { version = "0.5.0", optional = true }

# Removed hf_compat dependency as it is now in-tree
# Image crate for vision features: loading/resizing/processing images
image = { version = "=0.24.9", optional = true }
# Audio crate for reading/writing WAV: used by audio examples and IO
protobuf = "3.2"
clap = { version = "4.4", features = ["derive"] }
colored = "2.1"
google-cloud-storage = { version = "0.13.0", optional = true } 

# Audio crate for reading/writing WAV: used by audio examples and IO
hound = { version = "=3.5.1", optional = true }

rubato = { version = "=0.12.0", optional = true }
num-integer = { version = "=0.1.46", optional = true }
cffi = { version = "0.1.7", optional = true }
wgpu = { version = "=0.19.0", optional = true }
pollster = { version = "=0.3.0", optional = true }

bytemuck = { version = "1.16.1", optional = true, features = ["derive"] }
futures-intrusive = { version = "0.5", optional = true }
futures-channel = { version = "0.3", optional = true }
cudarc = { version = "0.10", optional = true }
cuda = { version = "0.4.0-pre.2", optional = true, features = ["cuda_10_0"] }
cublas = { version = "0.2", optional = true }
cudart = { version = "0.1", optional = true }
tokio = { version = "1.36", features = ["full"], optional = true }
futures = { version = "0.3", optional = true }
uuid = { version = "1.7", features = ["v4"], optional = true }
thiserror = "2.0.18"
indicatif = "0.18.3"
num-complex = "0.4.6"
ouroboros = "0.18.5"

numpy = { version = "0.22", optional = true }
actix-cors = { version = "0.7", optional = true }
actix-web-actors = { version = "4.3", optional = true }

byteorder = { version = "1.4", optional = true }

tonic = { version = "0.10", optional = true }
prost = { version = "0.12", optional = true }
prometheus = { version = "0.13", optional = true }
realfft = { version = "2.0", optional = true }

[dev-dependencies]
criterion = "=0.7.0"
env_logger = "=0.10.2"
tempfile = "=3.23.0"

[build-dependencies]
cc = "=1.0.87"

[[bench]]
name = "matmul_bench"
harness = false

[[bench]]
name = "safetensors_bench"
harness = false

[lib]
name = "tensor_engine"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python_bindings", "with_tokenizers", "safe_tensors", "vision", "audio", "multi_precision", "async_ops", "openblas"]
openblas = ["blas-src", "cblas-sys"]
multi_precision = ["half"]
safe_tensors = ["safetensors"]
with_tokenizers = ["tokenizers"]
with_tch = ["tch"]
quantized = []
backend_cuda = ["cudarc", "cuda", "cublas", "cudart", "bytemuck"]
backend_metal = ["metal"]
server = ["actix-web", "actix-cors", "actix-web-actors", "serde", "image", "base64", "tokio", "futures", "uuid"]
compat = ["half", "rocket", "serde"]
hf_compat = ["half", "serde", "byteorder"]

# Native tokenizer: compile the built-in Rust tokenizer and expose via Python when enabled
native_tokenizer = []
opencl = []
audio = ["hound", "rubato", "num-integer"]
vision = ["image"]
dtype_f16 = ["half"]
dtype_bf16 = ["half"]
dtype_f8 = []
python_bindings = ["pyo3", "numpy"]
py_abi3 = ["pyo3/abi3"]
backend_wgpu = ["wgpu", "pollster", "bytemuck", "futures-intrusive", "futures-channel"]
async_ops = ["tokio", "futures"]
distributed = []
parallel_io = []
opencl_support = ["opencl"]
grpc_server = ["tonic", "prost"]
metrics = ["prometheus"]
audio_fft = ["realfft"]

[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.27.0", optional = true }

# [patch.crates-io]
# Use local path overrides during testing so we can modify ctor/cffi behavior for Windows/MSVC.
# This matches the versions required by cffi-impl (0.1.6) and its ctor dependency.
# Note: Patches commented out as they are not currently needed and cause warnings
# ctor = { path = "vendor/ctor" }
# cffi-impl = { path = "vendor/cffi-impl-patch" }
