[package]
name = "cffi-impl"
version = "0.1.6"
edition = "2018"
authors = ["Vendor (for testing)"]
build = "build.rs"

[lib]
proc-macro = true

[dependencies]
ctor = "1.0.7"
darling = "0.23.0"
heck = "0.5.0"
log = "0.4"
phf = "0.13.1"
phf_codegen = "0.13.1"
pretty_env_logger = "0.5.0"
proc-macro2 = "1"
quote = "1"
syn = { version = "2.0.117", features = ["full"] }

[build-dependencies]
quote = "1"
syn = { version = "2.0.117", features = ["full"] }
phf_codegen = "0.13.1"