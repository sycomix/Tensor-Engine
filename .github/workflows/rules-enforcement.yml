name: Rules Enforcement

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  check-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify .mwx/rules exists
        run: |
          test -f .mwx/rules || (echo "Missing .mwx/rules" && exit 2)

      - name: Enforce .mwx/rules
        run: python scripts/check_rules.py
